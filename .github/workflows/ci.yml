name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra test --extra dev --frozen

      - name: Pre-commit
        run: uv run pre-commit run --all-files

      - name: Tests
        run: uv run pytest -q

      - name: Dependency audit
        run: uv audit --preview-features audit
