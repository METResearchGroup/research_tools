repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        pass_filenames: false
        types: [python]
      - id: lizard
        name: lizard complexity
        entry: uv run lizard src tests -l python -C 15
        language: system
        pass_filenames: false
        types: [python]
      - id: codespell
        name: codespell
        entry: uv run codespell src tests README.md SETUP.md CHANGELOG.md pyproject.toml
        language: system
        pass_filenames: false
