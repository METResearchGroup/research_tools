[project]
name = "research_tools"
version = "0.1.0"
description = "Internal LiteLLM-based service for structured LLM completions across providers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.96",
    "litellm==1.84.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.2",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.2",
]
dev = [
    "codespell>=2.4.1",
    "lizard>=1.18.0",
    "pre-commit>=4.2.0",
    "pyright>=1.1.400",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
